name: Claude code review

# Reviews every pull request that targets an integration branch.
#
# The review rules themselves live in AGENTS.md, which CLAUDE.md imports.
# Keeping them there rather than in this prompt means the rules a reviewer
# applies and the rules a contributing agent follows cannot drift apart.
#
# The review is advisory on purpose: it comments, it never gates. The only
# required check stays `Build and test` in ci.yml, so a slow or unavailable
# review can never block delivery.
on:
  pull_request:
    branches:
      - develop
      - master
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write

# A new push supersedes the review of the commit before it.
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude code review
    runs-on: ubuntu-latest

    # A pull request from a fork cannot read repository secrets, so the review
    # would fail for want of an API key. Skip it rather than report a false
    # failure on a contribution that is otherwise fine.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Review the pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          # Opus 5 is the most capable model available for review work, which is
          # what this job is for: a second opinion worth reading, not a linter.
          claude_args: |
            --model claude-opus-5
            --max-turns 15
          prompt: |
            Review only the changes this pull request introduces, against
            ${{ github.event.pull_request.base.ref }}.

            Follow the Code Review Rules in AGENTS.md, which CLAUDE.md imports.
            They name the authoritative specification, the order to raise
            findings in, and the bar a finding has to clear.
